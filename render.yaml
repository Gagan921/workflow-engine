services:
  - type: web
    name: workflow-engine-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: cd apps/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workflow-engine-db
          property: connectionString
      - key: PORT
        value: 10000

  - type: web
    name: workflow-engine-web
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: workflow-engine-api
          property: url

databases:
  - name: workflow-engine-db
    databaseName: workflow_engine
    user: workflow_user
    plan: free